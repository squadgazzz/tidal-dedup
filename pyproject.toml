[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tidal-dedup"
version = "0.1.0"
requires-python = ">= 3.10"

dependencies = [
  "tidalapi==0.8.8",
  "pyyaml~=6.0",
  "requests>=2.20",
  "pytest~=8.0",
  "pytest-mock~=3.8",
  "pytest-asyncio~=0.23"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
tidal-dedup = "tidal_dedup.__main__:main"
